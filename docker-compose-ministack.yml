services:
  mydevstack:
    image: beabys/mydevstack:latest
    container_name: mydevstack
    ports:
      # UI
      - "3000:3000"
      # Proxy port required for AWS emulator to connect to backend
      - "8081:8081"
    environment:
      AWS_ENDPOINT: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    # volumes:
      # Optional: override nginx config
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mydevstack-network

  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .dev/data/ministack:/tmp/ministack-state
    environment:
      - GATEWAY_PORT=4566
      - PERSIST_STATE=1
      - LOG_LEVEL=INFO
      - S3_PERSIST=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RDS_BASE_PORT=15432
      - ELASTICACHE_BASE_PORT=16379
      - LAMBDA_EXECUTOR=local
      - LAMBDA_DOCKER_NETWORK=mydevstack-network
    networks:
      - mydevstack-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  

  redis:
    image: redis:7-alpine
    container_name: ministack-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mydevstack-network
  
networks:
  mydevstack-network:
    name: mydevstack-network 
    driver: bridge