worker_processes auto;
error_log /dev/stdout warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream for the Go proxy backend
    upstream backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 3000;
        server_name localhost;

        # Serve static frontend files
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Proxy all Go API routes to the backend: /health, /proxy and every
        # AWS service prefix. Same-origin SPA calls these relative paths.
        # Placed BEFORE the /assets/ cache regex so API URIs ending in
        # .js/.css/.svg/... (e.g. S3 object keys) reach Go, not static cache.
        location ~ ^/(health|proxy|apigateway|cloudformation|cloudwatch-logs|cloudwatch|cognito|dynamodb-streams|dynamodb|ec2|ecr|ecs|elasticache|iam|kinesis|kms|lambda|msk|opensearch|rds|s3|secrets-manager|sesv2|sqs|ssm|sns|step-functions|vpc)(/.*)?$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Backend health check
        location /api/health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Fallback to index.html for Vue Router (SPA) - non-API only
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
