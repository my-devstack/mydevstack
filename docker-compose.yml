services:
  mydevstack:
    image: beabys/mydevstack:latest
    container_name: mydevstack
    ports:
      # UI
      - "3000:3000"
      # Proxy port required for AWS emulator to connect to backend
      - "8081:8081"
    environment:
      AWS_ENDPOINT: http://host.docker.internal:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PROXY_PORT: 8081
    # volumes:
      # Optional: override nginx config
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mydevstack-network

  
networks:
  mydevstack-network:
    name: mydevstack-network 
    driver: bridge