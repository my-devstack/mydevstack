version: '3.8'

services:
  mydevstack:
    image: beabys/mydevstack:latest
    container_name: mydevstack
    ports:
      - "3000:3000"
    environment:
      # Frontend configuration
      - PORT=3000
      
      # Backend proxy configuration
      - PROXY_PORT=8081
      
      # AWS emulator connection (LocalStack, MiniStack, etc.)
      - AWS_ENDPOINT=http://localhost:4566
      - AWS_REGION=us-east-1
      
      # AWS credentials (for emulator)
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      # Optional: override nginx config
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mydevstack-network

  # Optional: LocalStack for local AWS emulation
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda,dynamodb,sqs,sns,iam,kms,secretsmanager,ssm,apigateway,kinesis,cloudformation
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - LAMBDA_EXECUTOR=local
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/tmp/localstack:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mydevstack-network

networks:
  mydevstack-network:
    driver: bridge