version: '3.8'

services:
  mydevstack:
    image: beabys/mydevstack:latest
    container_name: mydevstack
    ports:
      - "3000:3000"
    environment:
      # AWS emulator connection (LocalStack, MiniStack, etc.)
      - AWS_ENDPOINT=http://floci:4566
      - AWS_REGION=us-east-1
      
      # AWS credentials (for emulator)
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    # volumes:
      # Optional: override nginx config
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mydevstack-network

  # Optional: LocalStack for local AWS emulation
  floci:
    image: hectorvent/floci:latest
    ports:
      - "4540:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.dev/data/floci:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_SERVICES_DOCKER_NETWORK: mydevstack-network
    networks:
      - mydevstack-network
    restart: unless-stopped
  
networks:
  mydevstack-network:
    name: mydevstack-network 
    driver: bridge