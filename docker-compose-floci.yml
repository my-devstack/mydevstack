services:
  mydevstack:
    image: beabys/mydevstack:latest
    container_name: mydevstack
    ports:
      # UI
      - "3000:3000"
      # Proxy port required for AWS emulator to connect to backend
      - "8081:8081"
    environment:
      AWS_ENDPOINT: http://floci:4566
      EMULATOR: FLOCI
    # volumes:
      # Optional: override nginx config
      # - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mydevstack-network

  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
      - "6379-6399:6379-6399" # ElastiCache Redis proxy ports
      - "7001-7099:7001-7099" # RDS proxy ports
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .dev/data/floci-aws:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_LAMBDA_CODE_PATH: /app/data/lambda
      FLOCI_SERVICES_DOCKER_NETWORK: mydevstack-network
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: 1025
      FLOCI_SERVICES_ECR_REGISTRY_BASE_PORT: 5100
      FLOCI_SERVICES_ECR_REGISTRY_MAX_PORT: 5199
      FLOCI_SERVICES_ECR_ENABLED: "true"
    networks:
      - mydevstack-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - mydevstack-network
  
networks:
  mydevstack-network:
    name: mydevstack-network 
    driver: bridge