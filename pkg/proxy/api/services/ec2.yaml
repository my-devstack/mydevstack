openapi: 3.0.0
info:
  title: "EC2"
  version: "1.0.0"

paths:
  # ============================================================
  # Instances
  # ============================================================
  /ec2/instances:
    get:
      tags: [EC2]
      summary: Describe EC2 instances
      description: |
        Returns a list of EC2 instances. Supports optional filtering
        by instance IDs, tags, and other criteria passed in the request body.
      operationId: describeInstances
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeInstances
                (e.g., InstanceIds, Filters, MaxResults, NextToken).
      responses:
        "200":
          description: List of EC2 instances (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [EC2]
      summary: Run EC2 instance
      description: |
        Launches a new EC2 instance. Requires ImageId and InstanceType.
        Accepts additional parameters like KeyName, SecurityGroupIds,
        SubnetId, and UserData.
      operationId: runInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for RunInstances
                (e.g., ImageId, InstanceType, KeyName, MinCount, MaxCount,
                SecurityGroupIds, SubnetId, UserData).
      responses:
        "200":
          description: EC2 instance launched (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/instances/{instanceId}:
    get:
      tags: [EC2]
      summary: Get EC2 instance
      description: |
        Returns detailed information about a specific EC2 instance.
      operationId: describeInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
          description: EC2 instance ID (e.g., i-1234567890abcdef0)
          example: i-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Additional parameters for DescribeInstances
                (e.g., Filters).
      responses:
        "200":
          description: EC2 instance details (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    delete:
      tags: [EC2]
      summary: Terminate EC2 instance
      description: |
        Terminates the specified EC2 instance.
      operationId: terminateInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
          description: EC2 instance ID to terminate
          example: i-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for TerminateInstances
                (e.g., InstanceIds — current instanceId used if not specified).
      responses:
        "200":
          description: Instance terminated (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/instances/{instanceId}/start:
    post:
      tags: [EC2]
      summary: Start EC2 instance
      description: |
        Starts the specified EC2 instance (transition from stopped to running).
      operationId: startInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
          description: EC2 instance ID to start
          example: i-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for StartInstances
                (e.g., InstanceIds — current instanceId used if not specified).
      responses:
        "200":
          description: Instance started (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/instances/{instanceId}/stop:
    post:
      tags: [EC2]
      summary: Stop EC2 instance
      description: |
        Stops the specified EC2 instance (transition from running to stopped).
      operationId: stopInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
          description: EC2 instance ID to stop
          example: i-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for StopInstances
                (e.g., InstanceIds — current instanceId used if not specified, Force).
      responses:
        "200":
          description: Instance stopped (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Key Pairs
  # ============================================================
  /ec2/key-pairs:
    get:
      tags: [EC2]
      summary: List key pairs
      description: |
        Returns a list of EC2 key pairs. Supports optional filtering
        by key names and tags.
      operationId: describeKeyPairs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeKeyPairs
                (e.g., KeyNames, Filters).
      responses:
        "200":
          description: List of key pairs (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [EC2]
      summary: Create key pair
      description: |
        Creates a new EC2 key pair with the specified name.
        Returns the private key material (pem or ppk format).
      operationId: createKeyPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateKeyPair
                (e.g., KeyName, KeyType, KeyFormat, TagSpecifications).
      responses:
        "200":
          description: Key pair created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/key-pairs/import:
    post:
      tags: [EC2]
      summary: Import key pair
      description: |
        Imports an existing public key to create a new EC2 key pair.
        Requires PublicKeyMaterial (base64-encoded SSH public key).
      operationId: importKeyPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for ImportKeyPair
                (e.g., KeyName, PublicKeyMaterial, TagSpecifications).
      responses:
        "200":
          description: Key pair imported (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/key-pairs/{keyName}:
    delete:
      tags: [EC2]
      summary: Delete key pair
      description: |
        Deletes the specified EC2 key pair.
      operationId: deleteKeyPair
      parameters:
        - name: keyName
          in: path
          required: true
          schema: { type: string }
          description: Name of the key pair to delete
          example: my-key-pair
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteKeyPair
                (e.g., KeyName — current keyName used if not specified).
      responses:
        "200":
          description: Key pair deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Security Groups
  # ============================================================
  /ec2/security-groups:
    get:
      tags: [EC2]
      summary: List security groups
      description: |
        Returns a list of EC2 security groups. Supports optional filtering
        by group IDs, names, and VPC ID.
      operationId: describeSecurityGroups
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeSecurityGroups
                (e.g., GroupIds, GroupNames, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of security groups (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [EC2]
      summary: Create security group
      description: |
        Creates a new EC2 security group. Requires GroupName and Description.
        Optionally specify VpcId to create the group in a specific VPC.
      operationId: createSecurityGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateSecurityGroup
                (e.g., GroupName, Description, VpcId, TagSpecifications).
      responses:
        "200":
          description: Security group created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/security-groups/{groupId}:
    delete:
      tags: [EC2]
      summary: Delete security group
      description: |
        Deletes the specified EC2 security group. The group must not
        be referenced by any other security group rules.
      operationId: deleteSecurityGroup
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
          description: Security group ID to delete
          example: sg-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteSecurityGroup
                (e.g., GroupId — current groupId used if not specified).
      responses:
        "200":
          description: Security group deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/security-groups/{groupId}/ingress:
    post:
      tags: [EC2]
      summary: Authorize security group ingress
      description: |
        Adds inbound rules to a security group. Requires specification
        of IpPermissions including protocol, port ranges, and source
        CIDR or security group references.
      operationId: authorizeSecurityGroupIngress
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
          description: Security group ID
          example: sg-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for AuthorizeSecurityGroupIngress
                (e.g., GroupId, IpPermissions with IpProtocol, FromPort,
                ToPort, IpRanges, UserIdGroupPairs).
      responses:
        "200":
          description: Ingress rule added (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # VPCs
  # ============================================================
  /ec2/vpcs:
    get:
      tags: [EC2]
      summary: List VPCs
      description: |
        Returns a list of VPCs. Supports optional filtering by VPC IDs,
        tags, and other criteria.
      operationId: describeVpcs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeVpcs
                (e.g., VpcIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of VPCs (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [EC2]
      summary: Create VPC
      description: |
        Creates a new VPC with the specified CIDR block.
        Optionally specify AmazonProvidedIpv6CidrBlock and Tenancy.
      operationId: createVpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateVpc
                (e.g., CidrBlock, AmazonProvidedIpv6CidrBlock, InstanceTenancy,
                TagSpecifications).
      responses:
        "200":
          description: VPC created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/vpcs/{vpcId}:
    delete:
      tags: [EC2]
      summary: Delete VPC
      description: |
        Deletes the specified VPC. The VPC must be empty (no subnets,
        security groups, route tables, internet gateways, etc.).
      operationId: deleteVpc
      parameters:
        - name: vpcId
          in: path
          required: true
          schema: { type: string }
          description: VPC ID to delete
          example: vpc-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteVpc
                (e.g., VpcId — current vpcId used if not specified).
      responses:
        "200":
          description: VPC deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Subnets
  # ============================================================
  /ec2/subnets:
    get:
      tags: [EC2]
      summary: List subnets
      description: |
        Returns a list of subnets. Supports optional filtering by subnet IDs,
        VPC ID, tags, and other criteria.
      operationId: describeSubnets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeSubnets
                (e.g., SubnetIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of subnets (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [EC2]
      summary: Create subnet
      description: |
        Creates a new subnet in the specified VPC. Requires VpcId, CidrBlock.
        Optionally specify AvailabilityZone or AvailabilityZoneId.
      operationId: createSubnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateSubnet
                (e.g., VpcId, CidrBlock, AvailabilityZone, AvailabilityZoneId,
                TagSpecifications).
      responses:
        "200":
          description: Subnet created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/subnets/{subnetId}:
    delete:
      tags: [EC2]
      summary: Delete subnet
      description: |
        Deletes the specified subnet. The subnet must not have any
        running EC2 instances or network interfaces.
      operationId: deleteSubnet
      parameters:
        - name: subnetId
          in: path
          required: true
          schema: { type: string }
          description: Subnet ID to delete
          example: subnet-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteSubnet
                (e.g., SubnetId — current subnetId used if not specified).
      responses:
        "200":
          description: Subnet deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Route Tables
  # ============================================================
  /ec2/route-tables:
    get:
      tags: [EC2]
      summary: List route tables
      description: |
        Returns a list of route tables. Supports optional filtering by
        route table IDs, VPC ID, tags, and other criteria.
      operationId: describeRouteTables
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeRouteTables
                (e.g., RouteTableIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of route tables (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [EC2]
      summary: Create route table
      description: |
        Creates a new route table in the specified VPC. Requires VpcId.
      operationId: createRouteTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateRouteTable
                (e.g., VpcId, TagSpecifications).
      responses:
        "200":
          description: Route table created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/route-tables/{rtbId}:
    delete:
      tags: [EC2]
      summary: Delete route table
      description: |
        Deletes the specified route table. The route table must not have
        any associated subnets or non-main routes.
      operationId: deleteRouteTable
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID to delete
          example: rtb-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteRouteTable
                (e.g., RouteTableId — current rtbId used if not specified).
      responses:
        "200":
          description: Route table deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/route-tables/{rtbId}/routes:
    post:
      tags: [EC2]
      summary: Create route
      description: |
        Creates a new route in the specified route table. Requires a
        destination CIDR block and one of the following targets:
        internet gateway ID, NAT gateway ID, or other target type.
      operationId: createRoute
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateRoute
                (e.g., RouteTableId, DestinationCidrBlock,
                GatewayId, NatGatewayId, NetworkInterfaceId, VpcPeeringConnectionId).
      responses:
        "200":
          description: Route created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/route-tables/{rtbId}/routes/{cidr}:
    delete:
      tags: [EC2]
      summary: Delete route
      description: |
        Deletes a route from the specified route table by destination CIDR.
      operationId: deleteRoute
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
        - name: cidr
          in: path
          required: true
          schema: { type: string }
          description: Destination CIDR block
          example: 10.0.0.0/16
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteRoute
                (e.g., RouteTableId, DestinationCidrBlock).
      responses:
        "200":
          description: Route deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/route-tables/{rtbId}/associate:
    post:
      tags: [EC2]
      summary: Associate route table
      description: |
        Associates a route table with a subnet. Requires SubnetId.
      operationId: associateRouteTable
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for AssociateRouteTable
                (e.g., RouteTableId, SubnetId).
      responses:
        "200":
          description: Route table associated (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/route-tables/{rtbId}/disassociate:
    post:
      tags: [EC2]
      summary: Disassociate route table
      description: |
        Disassociates a route table from a subnet. Requires AssociationId.
      operationId: disassociateRouteTable
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DisassociateRouteTable
                (e.g., AssociationId).
      responses:
        "200":
          description: Route table disassociated (passthrough from emulator)
          content:
            application/json:
              schema:
