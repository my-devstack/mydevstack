        Deletes the specified network ACL. The default network ACL for
        a VPC cannot be deleted.
      operationId: deleteNetworkAcl
      parameters:
        - name: naclId
          in: path
          required: true
          schema: { type: string }
          description: Network ACL ID to delete
          example: acl-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
