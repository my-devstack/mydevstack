      tags: [EC2]
      summary: Create network ACL entry
      description: |
        Creates a new entry (rule) in the specified network ACL.
        Requires RuleNumber, Protocol, RuleAction, Egress flag, and
        CidrBlock or Ipv6CidrBlock.
      operationId: createNetworkAclEntry
      parameters:
        - name: naclId
          in: path
          required: true
          schema: { type: string }
          description: Network ACL ID
          example: acl-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateNetworkAclEntry
                (e.g., NetworkAclId, RuleNumber, Protocol, RuleAction,
                Egress, CidrBlock, PortRange, IcmpTypeCode).
      responses:
        "200":
          description: Network ACL entry created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
