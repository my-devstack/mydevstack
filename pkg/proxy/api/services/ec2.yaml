          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /ec2/network-acls/{naclId}/entries/{ruleNumber}:
    delete:
      tags: [EC2]
      summary: Delete network ACL entry
      description: |
        Deletes a network ACL entry by rule number. Requires specifying
        whether it is an egress or ingress rule.
      operationId: deleteNetworkAclEntry
      parameters:
        - name: naclId
          in: path
          required: true
          schema: { type: string }
          description: Network ACL ID
          example: acl-1234567890abcdef0
        - name: ruleNumber
          in: path
          required: true
          schema: { type: integer }
          description: Rule number of the entry to delete
          example: 100
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
