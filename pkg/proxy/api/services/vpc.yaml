openapi: 3.0.0
info:
  title: "VPC"
  version: "1.0.0"

paths:
  # ============================================================
  # VPCs
  # ============================================================
  /vpc/vpcs:
    get:
      tags: [VPC]
      summary: Describe VPCs
      description: |
        Returns a list of VPCs. Supports optional filtering by VPC IDs,
        tags, and other criteria.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DescribeVpcs`.
      operationId: vpcDescribeVpcs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeVpcs
                (e.g., VpcIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of VPCs (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [VPC]
      summary: Create VPC
      description: |
        Creates a new VPC with the specified CIDR block.
        Optionally specify AmazonProvidedIpv6CidrBlock and Tenancy.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateVpc`.
      operationId: vpcCreateVpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateVpc
                (e.g., CidrBlock, AmazonProvidedIpv6CidrBlock, InstanceTenancy,
                TagSpecifications).
      responses:
        "200":
          description: VPC created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/vpcs/{vpcId}:
    delete:
      tags: [VPC]
      summary: Delete VPC
      description: |
        Deletes the specified VPC. The VPC must be empty (no subnets,
        security groups, route tables, internet gateways, etc.).
        The path parameter `vpcId` is used for routing only; actual parameters
        are passed in the JSON body.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteVpc`.
      operationId: vpcDeleteVpc
      parameters:
        - name: vpcId
          in: path
          required: true
          schema: { type: string }
          description: VPC ID to delete
          example: vpc-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteVpc
                (e.g., VpcId — current vpcId used if not specified).
      responses:
        "200":
          description: VPC deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Subnets
  # ============================================================
  /vpc/subnets:
    get:
      tags: [VPC]
      summary: Describe subnets
      description: |
        Returns a list of subnets. Supports optional filtering by subnet IDs,
        VPC ID, tags, and other criteria.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DescribeSubnets`.
      operationId: vpcDescribeSubnets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeSubnets
                (e.g., SubnetIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of subnets (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [VPC]
      summary: Create subnet
      description: |
        Creates a new subnet in the specified VPC. Requires VpcId, CidrBlock.
        Optionally specify AvailabilityZone or AvailabilityZoneId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateSubnet`.
      operationId: vpcCreateSubnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateSubnet
                (e.g., VpcId, CidrBlock, AvailabilityZone, AvailabilityZoneId,
                TagSpecifications).
      responses:
        "200":
          description: Subnet created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/subnets/{subnetId}:
    delete:
      tags: [VPC]
      summary: Delete subnet
      description: |
        Deletes the specified subnet. The subnet must not have any
        running EC2 instances or network interfaces.
        The path parameter `subnetId` is used for routing only; actual parameters
        are passed in the JSON body.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteSubnet`.
      operationId: vpcDeleteSubnet
      parameters:
        - name: subnetId
          in: path
          required: true
          schema: { type: string }
          description: Subnet ID to delete
          example: subnet-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteSubnet
                (e.g., SubnetId — current subnetId used if not specified).
      responses:
        "200":
          description: Subnet deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Route Tables
  # ============================================================
  /vpc/route-tables:
    get:
      tags: [VPC]
      summary: Describe route tables
      description: |
        Returns a list of route tables. Supports optional filtering by
        route table IDs, VPC ID, tags, and other criteria.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DescribeRouteTables`.
      operationId: vpcDescribeRouteTables
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeRouteTables
                (e.g., RouteTableIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of route tables (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [VPC]
      summary: Create route table
      description: |
        Creates a new route table in the specified VPC. Requires VpcId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateRouteTable`.
      operationId: vpcCreateRouteTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateRouteTable
                (e.g., VpcId, TagSpecifications).
      responses:
        "200":
          description: Route table created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/route-tables/{rtbId}:
    delete:
      tags: [VPC]
      summary: Delete route table
      description: |
        Deletes the specified route table. The route table must not have
        any associated subnets or non-main routes.
        The path parameter `rtbId` is used for routing only; actual parameters
        are passed in the JSON body.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteRouteTable`.
      operationId: vpcDeleteRouteTable
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID to delete
          example: rtb-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteRouteTable
                (e.g., RouteTableId — current rtbId used if not specified).
      responses:
        "200":
          description: Route table deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/route-tables/{rtbId}/routes:
    post:
      tags: [VPC]
      summary: Create route
      description: |
        Creates a new route in the specified route table. Requires a
        destination CIDR block and one of the following targets:
        internet gateway ID, NAT gateway ID, or other target type.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateRoute`.
      operationId: vpcCreateRoute
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateRoute
                (e.g., RouteTableId, DestinationCidrBlock,
                GatewayId, NatGatewayId, NetworkInterfaceId, VpcPeeringConnectionId).
      responses:
        "200":
          description: Route created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/route-tables/{rtbId}/routes/{cidr}:
    delete:
      tags: [VPC]
      summary: Delete route
      description: |
        Deletes a route from the specified route table by destination CIDR.
        The path parameter `cidr` is used for routing only; actual parameters
        are passed in the JSON body.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteRoute`.
      operationId: vpcDeleteRoute
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
        - name: cidr
          in: path
          required: true
          schema: { type: string }
          description: Destination CIDR block
          example: 10.0.0.0/16
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteRoute
                (e.g., RouteTableId, DestinationCidrBlock).
      responses:
        "200":
          description: Route deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/route-tables/{rtbId}/associate:
    post:
      tags: [VPC]
      summary: Associate route table
      description: |
        Associates a route table with a subnet. Requires SubnetId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=AssociateRouteTable`.
      operationId: vpcAssociateRouteTable
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for AssociateRouteTable
                (e.g., RouteTableId, SubnetId).
      responses:
        "200":
          description: Route table associated (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/route-tables/{rtbId}/disassociate:
    post:
      tags: [VPC]
      summary: Disassociate route table
      description: |
        Disassociates a route table from a subnet. Requires AssociationId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DisassociateRouteTable`.
      operationId: vpcDisassociateRouteTable
      parameters:
        - name: rtbId
          in: path
          required: true
          schema: { type: string }
          description: Route table ID
          example: rtb-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DisassociateRouteTable
                (e.g., AssociationId).
      responses:
        "200":
          description: Route table disassociated (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Internet Gateways
  # ============================================================
  /vpc/internet-gateways:
    get:
      tags: [VPC]
      summary: Describe internet gateways
      description: |
        Returns a list of internet gateways. Supports optional filtering
        by gateway IDs, VPC ID, tags, and other criteria.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DescribeInternetGateways`.
      operationId: vpcDescribeInternetGateways
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeInternetGateways
                (e.g., InternetGatewayIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of internet gateways (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [VPC]
      summary: Create internet gateway
      description: |
        Creates a new internet gateway. Optionally specify tags.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateInternetGateway`.
      operationId: vpcCreateInternetGateway
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateInternetGateway
                (e.g., TagSpecifications).
      responses:
        "200":
          description: Internet gateway created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/internet-gateways/{igwId}:
    delete:
      tags: [VPC]
      summary: Delete internet gateway
      description: |
        Deletes the specified internet gateway. The gateway must not
        be attached to any VPC.
        The path parameter `igwId` is used for routing only; actual parameters
        are passed in the JSON body.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteInternetGateway`.
      operationId: vpcDeleteInternetGateway
      parameters:
        - name: igwId
          in: path
          required: true
          schema: { type: string }
          description: Internet gateway ID to delete
          example: igw-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteInternetGateway
                (e.g., InternetGatewayId — current igwId used if not specified).
      responses:
        "200":
          description: Internet gateway deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/internet-gateways/{igwId}/attach:
    post:
      tags: [VPC]
      summary: Attach internet gateway
      description: |
        Attaches an internet gateway to the specified VPC. Requires VpcId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=AttachInternetGateway`.
      operationId: vpcAttachInternetGateway
      parameters:
        - name: igwId
          in: path
          required: true
          schema: { type: string }
          description: Internet gateway ID
          example: igw-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for AttachInternetGateway
                (e.g., InternetGatewayId, VpcId).
      responses:
        "200":
          description: Internet gateway attached (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/internet-gateways/{igwId}/detach:
    post:
      tags: [VPC]
      summary: Detach internet gateway
      description: |
        Detaches an internet gateway from the specified VPC. Requires VpcId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DetachInternetGateway`.
      operationId: vpcDetachInternetGateway
      parameters:
        - name: igwId
          in: path
          required: true
          schema: { type: string }
          description: Internet gateway ID
          example: igw-1234567890abcdef0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DetachInternetGateway
                (e.g., InternetGatewayId, VpcId).
      responses:
        "200":
          description: Internet gateway detached (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # NAT Gateways
  # ============================================================
  /vpc/nat-gateways:
    get:
      tags: [VPC]
      summary: Describe NAT gateways
      description: |
        Returns a list of NAT gateways. Supports optional filtering
        by gateway IDs, VPC ID, subnet ID, state, tags, and other criteria.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DescribeNatGateways`.
      operationId: vpcDescribeNatGateways
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeNatGateways
                (e.g., NatGatewayIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of NAT gateways (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [VPC]
      summary: Create NAT gateway
      description: |
        Creates a new NAT gateway in the specified subnet. Requires SubnetId
        and AllocationId (Elastic IP allocation ID).

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateNatGateway`.
      operationId: vpcCreateNatGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateNatGateway
                (e.g., SubnetId, AllocationId, TagSpecifications).
      responses:
        "200":
          description: NAT gateway created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/nat-gateways/{natGwId}:
    delete:
      tags: [VPC]
      summary: Delete NAT gateway
      description: |
        Deletes the specified NAT gateway.
        The path parameter `natGwId` is used for routing only; actual parameters
        are passed in the JSON body.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteNatGateway`.
      operationId: vpcDeleteNatGateway
      parameters:
        - name: natGwId
          in: path
          required: true
          schema: { type: string }
          description: NAT gateway ID to delete
          example: nat-1234567890abcdef0
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteNatGateway
                (e.g., NatGatewayId — current natGwId used if not specified).
      responses:
        "200":
          description: NAT gateway deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # Network ACLs
  # ============================================================
  /vpc/network-acls:
    get:
      tags: [VPC]
      summary: Describe network ACLs
      description: |
        Returns a list of network ACLs. Supports optional filtering
        by ACL IDs, VPC ID, tags, and other criteria.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DescribeNetworkAcls`.
      operationId: vpcDescribeNetworkAcls
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeNetworkAcls
                (e.g., NetworkAclIds, Filters, NextToken, MaxResults).
      responses:
        "200":
          description: List of network ACLs (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [VPC]
      summary: Create network ACL
      description: |
        Creates a new network ACL in the specified VPC. Requires VpcId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateNetworkAcl`.
      operationId: vpcCreateNetworkAcl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateNetworkAcl
                (e.g., VpcId, TagSpecifications).
      responses:
        "200":
          description: Network ACL created (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /vpc/network-acls/{naclId}:
    delete:
      tags: [VPC]
      summary: Delete network ACL
      description: |
        Deletes the specified network ACL. The default network ACL for
        a VPC cannot be deleted.
        The path parameter `naclId` is used for routing only; actual parameters
        are passed in the JSON body.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteNetworkAcl`.
      operationId: vpcDeleteNetworkAcl
      parameters:
        - name: naclId
          in: path
          required: true
          schema: { type: string }
          description: Network ACL ID to delete
          example: acl-1234567890abcdef0
