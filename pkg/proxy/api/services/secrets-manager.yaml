openapi: 3.0.0
info:
  title: "Secrets Manager"
  version: "1.0.0"

paths:
  # ============================================================
  # Secrets
  # ============================================================
  /secrets-manager/secrets:
    get:
      tags: [Secrets Manager]
      summary: List secrets
      description: |
        Returns a list of secrets in the account with optional filtering
        and pagination. Accepts both camelCase and TitleCase JSON keys.
      operationId: listSecrets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSecretsInput'
      responses:
        "200":
          description: List of secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [Secrets Manager]
      summary: Create secret
      description: |
        Creates a new secret. Requires Name. Provide SecretString or
        SecretBinary. Accepts both camelCase and TitleCase JSON keys.
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretInput'
      responses:
        "200":
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSecretOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /secrets-manager/secrets/{secretId}:
    get:
      tags: [Secrets Manager]
      summary: Describe secret
      description: |
        Returns metadata about a secret, including description, rotation
        configuration, and tags.
      operationId: describeSecret
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/SecretIdPath'
      responses:
        "200":
          description: Secret metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeSecretOutput'
        "404":
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    put:
      tags: [Secrets Manager]
      summary: Update secret
      description: |
        Updates the metadata or value of a secret. Accepts partial updates.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: updateSecret
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/SecretIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretInput'
      responses:
        "200":
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSecretOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    delete:
      tags: [Secrets Manager]
      summary: Delete secret
      description: |
        Deletes a secret. By default schedules deletion with a recovery
        window. Use ForceDeleteWithoutRecovery for immediate deletion.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: deleteSecret
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/SecretIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSecretInput'
      responses:
        "200":
          description: Secret deleted or scheduled for deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSecretOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "404":
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /secrets-manager/secrets/{secretId}/restore:
    post:
      tags: [Secrets Manager]
      summary: Restore secret
      description: |
        Restores a deleted secret that is scheduled for deletion.
      operationId: restoreSecret
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/SecretIdPath'
      responses:
        "200":
          description: Secret restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreSecretOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /secrets-manager/secrets/{secretId}/rotate:
    post:
      tags: [Secrets Manager]
      summary: Rotate secret
      description: |
        Configures and triggers rotation for a secret.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: rotateSecret
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/SecretIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSecretInput'
      responses:
        "200":
          description: Rotation configured or triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /secrets-manager/secrets/{secretId}/value:
    put:
      tags: [Secrets Manager]
      summary: Put secret value
      description: |
        Stores a new value for a secret. For versioned secrets, specify
        VersionStages or generate a new version.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: putSecretValue
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/SecretIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretValueInput'
      responses:
        "200":
          description: Secret value stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretValueOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    get:
      tags: [Secrets Manager]
      summary: Get secret value
      description: |
        Returns the decrypted value of a secret. Returns SecretString or
        SecretBinary depending on how the secret was stored.
      operationId: getSecretValue
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/SecretIdPath'
        - name: VersionId
          in: query
          required: false
          schema: { type: string }
          description: Version ID of the secret value
        - name: VersionStage
          in: query
          required: false
          schema: { type: string }
          description: Version stage (default AWSCURRENT)
      responses:
        "200":
          description: Secret value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSecretValueOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /secrets-manager/random-password:
    post:
      tags: [Secrets Manager]
      summary: Get random password
      description: |
        Generates a random password with configurable complexity rules.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: getRandomPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRandomPasswordInput'
      responses:
        "200":
          description: Random password generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRandomPasswordOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

components:
  schemas:
    # ============================================================
    # Core types
    # ============================================================
    SecretListEntry:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        Description:
          type: string
        KmsKeyId:
          type: string
        RotationEnabled:
          type: boolean
        RotationLambdaARN:
          type: string
        RotationRules:
          $ref: '#/components/schemas/RotationRulesType'
        LastRotatedDate:
          type: number
          description: Last rotation timestamp (Unix epoch)
        LastChangedDate:
          type: number
          description: Last change timestamp (Unix epoch)
        LastAccessedDate:
          type: number
          description: Last access timestamp (Unix epoch)
        DeletedDate:
          type: number
          description: Deletion timestamp (Unix epoch)
        Tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        SecretVersionsToStages:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        CreatedDate:
          type: number
          description: Creation timestamp (Unix epoch)
        OwningService:
          type: string
        PrimaryRegion:
          type: string

    RotationRulesType:
      type: object
      properties:
        AutomaticallyRotateAfterDays:
          type: integer
          format: int64
        Duration:
          type: string
        ScheduleExpression:
          type: string

    Tag:
      type: object
      required: [Key, Value]
      properties:
        Key:
          type: string
        Value:
          type: string

    # ============================================================
    # ListSecrets
    # ============================================================
    ListSecretsInput:
      type: object
      properties:
        IncludePlannedDeletion:
          type: boolean
        MaxResults:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        NextToken:
          type: string
        Filters:
          type: array
          items:
            type: object
            properties:
              Key:
                type: string
                enum: [description, name, tag-key, tag-value, primary-region, owning-service, all]
              Values:
                type: array
                items:
                  type: string
        SortOrder:
          type: string
          enum: [asc, desc]

    ListSecretsOutput:
      type: object
      properties:
        SecretList:
          type: array
          items:
            $ref: '#/components/schemas/SecretListEntry'
        NextToken:
          type: string

    # ============================================================
    # CreateSecret
    # ============================================================
    CreateSecretInput:
      type: object
      required: [Name]
      properties:
        Name:
          type: string
        ClientRequestToken:
          type: string
        Description:
          type: string
        KmsKeyId:
          type: string
        SecretBinary:
          type: string
          format: byte
          description: Base64-encoded binary secret data
        SecretString:
          type: string
          description: String secret data
        Tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        AddReplicaRegions:
          type: array
          items:
            type: object
            properties:
              Region:
                type: string
              KmsKeyId:
                type: string
        ForceOverwriteReplicaSecret:
          type: boolean

    CreateSecretOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        VersionId:
          type: string

    # ============================================================
    # DescribeSecret
    # ============================================================
    DescribeSecretInput:
      type: object
      properties:
        SecretId:
          type: string

    DescribeSecretOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        Description:
          type: string
        KmsKeyId:
          type: string
        RotationEnabled:
          type: boolean
        RotationLambdaARN:
          type: string
        RotationRules:
          $ref: '#/components/schemas/RotationRulesType'
        LastRotatedDate:
          type: number
        LastChangedDate:
          type: number
        LastAccessedDate:
          type: number
        DeletedDate:
          type: number
        Tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        VersionIdsToStages:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        CreatedDate:
          type: number
        OwningService:
          type: string
        PrimaryRegion:
          type: string
        ReplicationStatus:
          type: array
          items:
            type: object
            properties:
              Region:
                type: string
              KmsKeyId:
                type: string
              Status:
                type: string
              StatusMessage:
                type: string
              LastAccessedDate:
                type: number

    # ============================================================
    # UpdateSecret
    # ============================================================
    UpdateSecretInput:
      type: object
      required: [SecretId]
      properties:
        SecretId:
          type: string
        ClientRequestToken:
          type: string
        Description:
          type: string
        KmsKeyId:
          type: string
        SecretBinary:
          type: string
          format: byte
        SecretString:
          type: string

    UpdateSecretOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        VersionId:
          type: string

    # ============================================================
    # DeleteSecret
    # ============================================================
    DeleteSecretInput:
      type: object
      properties:
        SecretId:
          type: string
        RecoveryWindowInDays:
          type: integer
          format: int64
          default: 30
        ForceDeleteWithoutRecovery:
          type: boolean

    DeleteSecretOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        DeletionDate:
          type: number

    # ============================================================
    # RestoreSecret
    # ============================================================
    RestoreSecretInput:
      type: object
      properties:
        SecretId:
          type: string

    RestoreSecretOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string

    # ============================================================
    # RotateSecret
    # ============================================================
    RotateSecretInput:
      type: object
      required: [SecretId]
      properties:
        SecretId:
          type: string
        ClientRequestToken:
          type: string
        RotationLambdaARN:
          type: string
        RotationRules:
          $ref: '#/components/schemas/RotationRulesType'
        RotateImmediately:
          type: boolean

    RotateSecretOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        VersionId:
          type: string

    # ============================================================
    # PutSecretValue
    # ============================================================
    PutSecretValueInput:
      type: object
      required: [SecretId]
      properties:
        SecretId:
          type: string
        ClientRequestToken:
          type: string
        SecretBinary:
          type: string
          format: byte
        SecretString:
          type: string
        VersionStages:
          type: array
          items:
            type: string
        RotateImmediately:
          type: boolean

    PutSecretValueOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        VersionId:
          type: string
        VersionStages:
          type: array
          items:
            type: string

    # ============================================================
    # GetSecretValue
    # ============================================================
    GetSecretValueInput:
      type: object
      properties:
        SecretId:
          type: string
        VersionId:
          type: string
        VersionStage:
          type: string

    GetSecretValueOutput:
      type: object
      properties:
        ARN:
          type: string
        Name:
          type: string
        VersionId:
          type: string
        SecretString:
          type: string
        SecretBinary:
          type: string
          format: byte
        VersionStages:
          type: array
          items:
            type: string
        CreatedDate:
          type: number

    # ============================================================
    # GetRandomPassword
    # ============================================================
    GetRandomPasswordInput:
      type: object
      properties:
        PasswordLength:
          type: integer
          format: int64
          minimum: 1
          maximum: 4096
          default: 32
        ExcludeCharacters:
          type: string
        ExcludeNumbers:
          type: boolean
        ExcludePunctuation:
          type: boolean
        ExcludeUppercase:
          type: boolean
        ExcludeLowercase:
          type: boolean
        IncludeSpace:
          type: boolean
        RequireEachIncludedType:
          type: boolean

    GetRandomPasswordOutput:
      type: object
      properties:
        RandomPassword:
          type: string
