paths:
  /health:
    get:
      tags: [Management]
      summary: Health check
      description: |
        Returns the health status of the proxy, including connectivity to the
        AWS emulator backend and proxy version information. Response is cached for 30 seconds.
      operationId: getHealth
      responses:
        "200":
          description: Proxy is healthy
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/HealthResponse'
        "503":
          description: Proxy is unhealthy
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/HealthResponse'

  /proxy/region:
    post:
      tags: [Management]
      summary: Update AWS region
      description: |
        Updates the AWS region used by the proxy at runtime.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: updateRegion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../common/_components.yaml#/components/schemas/RegionRequest'
      responses:
        "200":
          description: Region updated successfully
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/RegionResponse'
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
