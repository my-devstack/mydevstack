openapi: 3.0.0
info:
  title: "ElastiCache"
  version: "1.0.0"

paths:
  # ============================================================
  # Cache Clusters
  # ============================================================
  /elasticache/cache-clusters:
    get:
      tags: [ElastiCache]
      summary: Describe cache clusters
      description: |
        Returns a list of ElastiCache cache clusters. Supports optional
        filtering by CacheClusterId, MaxRecords, Marker, and ShowCacheNodeInfo.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DescribeCacheClusters`
        and `Version=2015-02-01`.
      operationId: describeCacheClusters
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DescribeCacheClusters
                (e.g., CacheClusterId, MaxRecords, Marker, ShowCacheNodeInfo).
                See [AWS docs](https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_DescribeCacheClusters.html).
      responses:
        "200":
          description: List of cache clusters (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [ElastiCache]
      summary: Create cache cluster
      description: |
        Creates a new ElastiCache cache cluster. Required parameters
        include CacheClusterId and NumCacheNodes or ReplicationGroupId.

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=CreateCacheCluster`
        and `Version=2015-02-01`.
      operationId: createCacheCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for CreateCacheCluster
                (e.g., CacheClusterId, NumCacheNodes, CacheNodeType, Engine,
                EngineVersion, CacheSubnetGroupName, SecurityGroupIds, Port).
                See [AWS docs](https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_CreateCacheCluster.html).
      responses:
        "200":
          description: Created cache cluster (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /elasticache/cache-clusters/{id}:
    delete:
      tags: [ElastiCache]
      summary: Delete cache cluster
      description: |
        Deletes an ElastiCache cache cluster.
        The path parameter `id` is used for routing only; actual parameters
        are passed in the JSON body (e.g., CacheClusterId).

        Request body parameters (JSON) are converted to form fields and
        forwarded to the emulator with `Action=DeleteCacheCluster`
        and `Version=2015-02-01`.
      operationId: deleteCacheCluster
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Cache cluster ID (routing only; pass CacheClusterId in body)
          example: my-cluster
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Parameters for DeleteCacheCluster
                (e.g., CacheClusterId, FinalSnapshotIdentifier).
                See [AWS docs](https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_DeleteCacheCluster.html).
      responses:
        "200":
          description: Cache cluster deleted (passthrough from emulator)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

