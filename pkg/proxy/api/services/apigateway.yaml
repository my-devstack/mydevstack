openapi: 3.0.0
info:
  title: "API Gateway"
  version: "1.0.0"

paths:
  # ============================================================
  # V2 HTTP APIs
  # ============================================================

  # --- 1. GET /apigateway/apis ---
  /apigateway/apis:
    get:
      tags: [API Gateway]
      summary: Get HTTP APIs (V2)
      description: |
        Returns a list of HTTP APIs (V2) with optional pagination.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: getApis
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetApisInput'
      responses:
        "200":
          description: List of HTTP APIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApisOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    # --- 2. POST /apigateway/apis ---
    post:
      tags: [API Gateway]
      summary: Create HTTP API (V2)
      description: |
        Creates a new HTTP API (V2). Defaults ProtocolType to HTTP if not specified.
        For WEBSOCKET protocol, RouteSelectionExpression defaults to $request.body.action.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: createApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiInput'
      responses:
        "200":
          description: HTTP API created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 3. GET /apigateway/apis/{apiId} ---
  /apigateway/apis/{apiId}:
    get:
      tags: [API Gateway]
      summary: Get HTTP API (V2)
      description: |
        Returns information about a specific HTTP API (V2).
      operationId: getApi
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      responses:
        "200":
          description: HTTP API details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    # --- 4. DELETE /apigateway/apis/{apiId} ---
    delete:
      tags: [API Gateway]
      summary: Delete HTTP API (V2)
      description: |
        Deletes a specific HTTP API (V2).
      operationId: deleteApi
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      responses:
        "200":
          description: HTTP API deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteApiOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 5-8: Routes ---
  /apigateway/apis/{apiId}/routes:
    get:
      tags: [API Gateway]
      summary: Get routes (V2)
      description: |
        Returns a list of routes for a given HTTP API (V2).
      operationId: getRoutes
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRoutesOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [API Gateway]
      summary: Create route (V2)
      description: |
        Creates a new route for an HTTP API (V2). RouteKey is required.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: createRoute
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteInput'
      responses:
        "200":
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRouteOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /apigateway/apis/{apiId}/routes/{routeId}:
    put:
      tags: [API Gateway]
      summary: Update route (V2)
      description: |
        Updates a route for an HTTP API (V2).
        Accepts both camelCase and TitleCase JSON keys.
      operationId: updateRoute
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
        - name: routeId
          in: path
          required: true
          schema: { type: string }
          description: Route ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRouteInput'
      responses:
        "200":
          description: Route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRouteOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    delete:
      tags: [API Gateway]
      summary: Delete route (V2)
      description: |
        Deletes a route from an HTTP API (V2).
      operationId: deleteRoute
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
        - name: routeId
          in: path
          required: true
          schema: { type: string }
          description: Route ID
      responses:
        "200":
          description: Route deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRouteOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 9-12: Integrations (V2) ---
  /apigateway/apis/{apiId}/integrations:
    get:
      tags: [API Gateway]
      summary: Get integrations (V2)
      description: |
        Returns a list of integrations for a given HTTP API (V2).
      operationId: getIntegrations
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIntegrationsOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [API Gateway]
      summary: Create integration (V2)
      description: |
        Creates a new integration for an HTTP API (V2). IntegrationType is required.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: createIntegration
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationInput'
      responses:
        "200":
          description: Integration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIntegrationOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /apigateway/apis/{apiId}/integrations/{integrationId}:
    put:
      tags: [API Gateway]
      summary: Update integration (V2)
      description: |
        Updates an integration for an HTTP API (V2).
        Accepts both camelCase and TitleCase JSON keys.
      operationId: updateIntegration
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
        - name: integrationId
          in: path
          required: true
          schema: { type: string }
          description: Integration ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationInput'
      responses:
        "200":
          description: Integration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIntegrationOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    delete:
      tags: [API Gateway]
      summary: Delete integration (V2)
      description: |
        Deletes an integration from an HTTP API (V2).
      operationId: deleteIntegration
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
        - name: integrationId
          in: path
          required: true
          schema: { type: string }
          description: Integration ID
      responses:
        "200":
          description: Integration deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIntegrationOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 13-17: Stages (V2) ---
  /apigateway/apis/{apiId}/stages:
    get:
      tags: [API Gateway]
      summary: Get stages (V2)
      description: |
        Returns a list of stages for a given HTTP API (V2).
      operationId: getStages
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      responses:
        "200":
          description: List of stages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStagesOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    post:
      tags: [API Gateway]
      summary: Create stage (V2)
      description: |
        Creates a new stage for an HTTP API (V2). StageName is required.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: createStage
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageInput'
      responses:
        "200":
          description: Stage created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStageOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  /apigateway/apis/{apiId}/stages/{stageName}:
    get:
      tags: [API Gateway]
      summary: Get stage (V2)
      description: |
        Returns information about a specific stage for an HTTP API (V2).
      operationId: getStage
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
        - name: stageName
          in: path
          required: true
          schema: { type: string }
          description: Stage name
      responses:
        "200":
          description: Stage details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStageOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    put:
      tags: [API Gateway]
      summary: Update stage (V2)
      description: |
        Updates a stage for an HTTP API (V2).
        Accepts both camelCase and TitleCase JSON keys.
      operationId: updateStage
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
        - name: stageName
          in: path
          required: true
          schema: { type: string }
          description: Stage name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageInput'
      responses:
        "200":
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStageOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    delete:
      tags: [API Gateway]
      summary: Delete stage (V2)
      description: |
        Deletes a stage from an HTTP API (V2).
      operationId: deleteStage
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
        - name: stageName
          in: path
          required: true
          schema: { type: string }
          description: Stage name
      responses:
        "200":
          description: Stage deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStageOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 18. POST /apigateway/apis/{apiId}/invoke-url ---
  /apigateway/apis/{apiId}/invoke-url:
    post:
      tags: [API Gateway]
      summary: Get invoke URL (V2)
      description: |
        Generates the invocation URL for an HTTP API (V2) stage.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: getInvokeUrlV2
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/ApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeUrlRequestV2'
      responses:
        "200":
          description: Invoke URL
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/InvokeUrlResponse'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # ============================================================
  # V1 REST APIs
  # ============================================================

  # --- 19. GET /apigateway/rest-apis ---
  /apigateway/rest-apis:
    get:
      tags: [API Gateway]
      summary: Get REST APIs (V1)
      description: |
        Returns a list of REST APIs (V1) with optional pagination.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: getRestApis
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRestApisInput'
      responses:
        "200":
          description: List of REST APIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRestApisOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    # --- 20. POST /apigateway/rest-apis ---
    post:
      tags: [API Gateway]
      summary: Create REST API (V1)
      description: |
        Creates a new REST API (V1). Name is required.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: createRestApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestApiInput'
      responses:
        "200":
          description: REST API created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRestApiOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 21. PUT /apigateway/rest-apis/{restApiId} ---
  /apigateway/rest-apis/{restApiId}:
    put:
      tags: [API Gateway]
      summary: Update REST API (V1)
      description: |
        Updates a REST API (V1). Accepts either a simple format with
        name/description fields, or the SDK format with patchOperations array.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: updateRestApi
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RestApiUpdateSimpleRequest'
                - $ref: '#/components/schemas/UpdateRestApiInput'
      responses:
        "200":
          description: REST API updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRestApiOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    # --- 22. GET /apigateway/rest-apis/{restApiId} ---
    get:
      tags: [API Gateway]
      summary: Get REST API (V1)
      description: |
        Returns information about a specific REST API (V1).
      operationId: getRestApi
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
      responses:
        "200":
          description: REST API details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRestApiOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    # --- 23. DELETE /apigateway/rest-apis/{restApiId} ---
    delete:
      tags: [API Gateway]
      summary: Delete REST API (V1)
      description: |
        Deletes a specific REST API (V1).
      operationId: deleteRestApi
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
      responses:
        "200":
          description: REST API deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRestApiOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 24. POST /apigateway/rest-apis/{restApiId}/import ---
  /apigateway/rest-apis/{restApiId}/import:
    post:
      tags: [API Gateway]
      summary: Import REST API (V1)
      description: |
        Imports a Swagger/OpenAPI specification into an existing REST API (V1).
        Accepts raw JSON body or {"body":"<base64>"} format.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: importRestApi
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRestApiRequest'
      responses:
        "200":
          description: REST API imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRestApiOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 25. GET /apigateway/rest-apis/{restApiId}/resources ---
  /apigateway/rest-apis/{restApiId}/resources:
    get:
      tags: [API Gateway]
      summary: Get resources (V1)
      description: |
        Returns a list of resources for a given REST API (V1).
        Returns empty arrays if the API is not found.
      operationId: getResources
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResourcesOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    # --- 27. POST /apigateway/rest-apis/{restApiId}/resources ---
    post:
      tags: [API Gateway]
      summary: Create resource (V1)
      description: |
        Creates a new resource in a REST API (V1). ParentId and PathPart are required.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: createResource
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceInput'
      responses:
        "200":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResourceOutput'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 26. GET /apigateway/rest-apis/{restApiId}/resources/{resourceId} ---
  /apigateway/rest-apis/{restApiId}/resources/{resourceId}:
    get:
      tags: [API Gateway]
      summary: Get resource (V1)
      description: |
        Returns information about a specific resource in a REST API (V1).
      operationId: getResource
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
          description: Resource ID
      responses:
        "200":
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResourceOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

    # --- 28. DELETE /apigateway/rest-apis/{restApiId}/resources/{resourceId} ---
    delete:
      tags: [API Gateway]
      summary: Delete resource (V1)
      description: |
        Deletes a resource from a REST API (V1).
      operationId: deleteResource
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
          description: Resource ID
      responses:
        "200":
          description: Resource deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResourceOutput'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../common/_components.yaml#/components/schemas/ErrorResponse'

  # --- 29-31: Methods ---
  /apigateway/rest-apis/{restApiId}/resources/{resourceId}/methods/{httpMethod}:
    put:
      tags: [API Gateway]
      summary: Put method (V1)
      description: |
        Creates or updates a method for a resource in a REST API (V1).
        AuthorizationType is required.
        Accepts both camelCase and TitleCase JSON keys.
      operationId: putMethod
      parameters:
        - $ref: '../common/_parameters.yaml#/components/parameters/RestApiIdPath'
        - name: resourceId
          in: path
          required: true
          schema: { type: string }
          description: Resource ID
        - name: httpMethod
          in: path
          required: true
          schema: { type: string }
          description: HTTP method (e.g., GET, POST, PUT, DELETE, ANY)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMethodInput'
      responses:
        "200":
