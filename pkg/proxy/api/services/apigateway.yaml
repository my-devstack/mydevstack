    # ============================================================
    # V1 REST API (apigateway SDK) Core Types
    # ============================================================

    RestApi:
      type: object
      description: Represents a REST API (V1)
      properties:
        id:
          type: string
          description: The API's ID
        name:
          type: string
          description: The API's name
        description:
          type: string
          description: The API's description
        createdDate:
          type: string
          format: date-time
          description: The timestamp when the API was created
        version:
          type: string
          description: A version identifier for the API
        warnings:
          type: array
          items:
            type: string
          description: The warning messages
        binaryMediaTypes:
          type: array
          items:
            type: string
          description: The list of binary media types supported by the RestApi
        minimumCompressionSize:
          type: integer
          format: int32
          description: The minimum size in bytes that a payload must be before compression
        apiKeySource:
          type: string
          enum: [HEADER, AUTHORIZER]
          description: The source of the API key for metering requests according to a usage plan
        endpointConfiguration:
          type: object
          properties:
            types:
              type: array
              items:
                type: string
                enum: [EDGE, REGIONAL, PRIVATE]
              description: A list of endpoint types of an API or its custom domain name
            vpcEndpointIds:
              type: array
              items:
                type: string
              description: A list of VPC endpoint IDs of an API
        policy:
          type: string
          description: A stringified JSON policy document
        tags:
          type: object
          additionalProperties:
            type: string
          description: The collection of tags
        disableExecuteApiEndpoint:
          type: boolean
          description: Specifies whether clients can invoke your API by using the default execute-api endpoint
        rootResourceId:
          type: string
          description: The ID of the API's root resource

    Resource:
      type: object
      description: Represents a resource in a REST API (V1)
      properties:
        id:
          type: string
          description: The resource's ID
        parentId:
          type: string
          description: The parent resource ID
        pathPart:
          type: string
          description: The path part for the resource
        path:
          type: string
          description: The full path for the resource
        resourceMethods:
          type: object
          additionalProperties:
            type: object
            properties:
              httpMethod:
                type: string
              authorizationType:
                type: string
              apiKeyRequired:
                type: boolean
          description: The methods defined on this resource

    Method:
      type: object
      description: Represents a method on a resource in a REST API (V1)
      properties:
        httpMethod:
          type: string
          description: The HTTP method
        authorizationType:
          type: string
          enum: [NONE, AWS_IAM, CUSTOM, COGNITO_USER_POOLS, REQUEST]
          description: The authorization type for the method
        authorizerId:
          type: string
          description: The identifier of an Authorizer to use on this method
        authorizationScopes:
          type: array
          items:
            type: string
          description: A list of authorization scopes
        apiKeyRequired:
          type: boolean
          description: Specifies whether the method requires a valid ApiKey
        requestValidatorId:
          type: string
          description: The identifier of a request validator
        operationName:
          type: string
          description: A human-friendly operation identifier
        requestParameters:
          type: object
          additionalProperties:
            type: boolean
          description: A key-value map of required or optional parameters and whether they are required
        requestModels:
          type: object
          additionalProperties:
            type: string
          description: A key-value map specifying the content types and schemas for the method request
        methodResponses:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MethodResponse'
          description: The method's responses
        methodIntegration:
          $ref: '#/components/schemas/IntegrationV1'
          description: The method's integration
        authorizationFlags:
          type: string
          description: Authorization flags

    MethodResponse:
      type: object
      description: Represents a method response of a REST API (V1)
      properties:
        statusCode:
          type: string
          description: The HTTP status code
        responseParameters:
          type: object
          additionalProperties:
            type: boolean
          description: A key-value map specifying required or optional response parameters
        responseModels:
          type: object
          additionalProperties:
            type: string
          description: Specifies the Model resources to use for the response's content types

    IntegrationV1:
      type: object
      description: Represents an integration for a REST API (V1)
      properties:
        type:
          type: string
          enum: [AWS, AWS_PROXY, HTTP, HTTP_PROXY, MOCK]
          description: The integration type
        httpMethod:
          type: string
          description: The integration's HTTP method
        uri:
          type: string
          format: uri
          description: The integration's URI
        credentials:
          type: string
          description: The credentials required for the integration
        requestParameters:
          type: object
          additionalProperties:
            type: string
          description: A key-value map specifying request parameters that are passed from the method request to the back end
        requestTemplates:
          type: object
          additionalProperties:
            type: string
          description: Represents a map of Velocity templates that are applied on the request payload
        passthroughBehavior:
          type: string
          enum: [WHEN_NO_MATCH, WHEN_NO_TEMPLATES, NEVER]
          description: The integration's passthrough behavior
        contentHandling:
          type: string
          enum: [CONVERT_TO_BINARY, CONVERT_TO_TEXT]
          description: Specifies how to handle response payload content type conversions
        cacheNamespace:
          type: string
          description: The integration's cache namespace
        cacheKeyParameters:
          type: array
          items:
            type: string
          description: A list of request parameters whose values API Gateway caches
        integrationResponses:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IntegrationResponse'
          description: The integration responses
        tlsConfig:
          $ref: '#/components/schemas/TlsConfig'
        timeoutInMillis:
          type: integer
          format: int32
          description: The integration's timeout

    IntegrationResponse:
      type: object
      description: Represents an integration response in a REST API (V1)
      properties:
        statusCode:
          type: string
          description: The HTTP status code
        selectionPattern:
          type: string
          description: Specifies the regular expression (regex) pattern used to choose an integration response
        responseParameters:
          type: object
          additionalProperties:
            type: string
          description: A key-value map specifying response parameters that are passed to the method response
        responseTemplates:
          type: object
          additionalProperties:
            type: string
          description: The templates used to transform the integration response body
        contentHandling:
          type: string
          enum: [CONVERT_TO_BINARY, CONVERT_TO_TEXT]

    Deployment:
      type: object
      description: Represents a deployment of a REST API (V1)
      properties:
        id:
          type: string
          description: The deployment ID
        description:
          type: string
          description: The deployment description
        createdDate:
          type: string
          format: date-time
          description: The timestamp when the deployment was created
        apiSummary:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/MethodSnapshot'
          description: A summary of the API resources and methods

    MethodSnapshot:
      type: object
      properties:
        authorizationType:
          type: string
        apiKeyRequired:
          type: boolean

    StageV1:
      type: object
      description: Represents a stage for a REST API (V1)
      properties:
        deploymentId:
          type: string
          description: The identifier of the Deployment that the stage points to
        clientCertificateId:
          type: string
          description: The identifier of a client certificate for the stage
        stageName:
          type: string
          description: The stage name
        description:
          type: string
          description: The stage description
        cacheClusterEnabled:
          type: boolean
          description: Whether caching is enabled for the stage
        cacheClusterSize:
          type: string
          description: The stage's cache cluster size
          enum: ['0.5', '1.6', '6.1', '13.5', '28.4', '58.2', '118', '237']
        cacheClusterStatus:
          type: string
          description: The status of the cache cluster for the stage
          enum: [CREATE_IN_PROGRESS, AVAILABLE, DELETE_IN_PROGRESS, NOT_AVAILABLE, FLUSH_IN_PROGRESS]
        methodSettings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MethodSetting'
          description: A map that defines the method settings for a stage
        variables:
          type: object
          additionalProperties:
            type: string
          description: A map that defines the stage variables
        documentationVersion:
          type: string
          description: The version of the associated API documentation
        accessLogSettings:
          $ref: '#/components/schemas/AccessLogSettings'
        canarySettings:
          $ref: '#/components/schemas/CanarySettings'
        tracingEnabled:
          type: boolean
          description: Specifies whether active tracing with X-ray is enabled
        webAclArn:
          type: string
          description: The ARN of the WebAcl associated with the Stage
        tags:
          type: object
          additionalProperties:
            type: string
          description: The collection of tags
        createdDate:
          type: string
          format: date-time
          description: The timestamp when the stage was created
        lastUpdatedDate:
          type: string
          format: date-time
          description: The timestamp when the stage was last updated

    MethodSetting:
      type: object
      properties:
        metricsEnabled:
          type: boolean
        loggingLevel:
          type: string
        dataTraceEnabled:
          type: boolean
        throttlingBurstLimit:
          type: integer
          format: int32
        throttlingRateLimit:
          type: number
          format: double
        cachingEnabled:
          type: boolean
        cacheTtlInSeconds:
          type: integer
          format: int32
        cacheDataEncrypted:
          type: boolean
        requireAuthorizationForCacheControl:
          type: boolean
        unauthorizedCacheControlHeaderStrategy:
          type: string

    CanarySettings:
      type: object
      properties:
        percentTraffic:
          type: number
          format: double
          description: The percent of traffic directed to a canary deployment
        deploymentId:
          type: string
          description: The ID of the canary deployment
        stageVariableOverrides:
          type: object
          additionalProperties:
            type: string
          description: Stage variables overridden for a canary release
        useStageCache:
          type: boolean
          description: Whether the canary deployment uses the stage cache

    PatchOperation:
      type: object
      description: A patch operation to update a REST API resource
      properties:
        op:
          type: string
          enum: [add, remove, replace, move, copy, test]
          description: The update operation to perform
        path:
          type: string
          description: The operation path (e.g., /name, /description)
        value:
          type: string
          description: The new value
        from:
          type: string
          description: The source path for copy/move operations

