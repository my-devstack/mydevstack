components:
  schemas:
    # ============================================================
    # V2 HTTP API (apigatewayv2 SDK) Core Types
    # ============================================================

    Api:
      type: object
      description: Represents an HTTP API (V2) in API Gateway
      properties:
        ApiEndpoint:
          type: string
          description: The URI of the API, of the form https://{api-id}.execute-api.{region}.amazonaws.com
        ApiId:
          type: string
          description: The API ID
        ApiKeySelectionExpression:
          type: string
          description: An API key selection expression, e.g., $request.header.x-api-key
        CorsConfiguration:
          $ref: '#/components/schemas/CorsConfiguration'
        CreatedDate:
          type: string
          format: date-time
          description: The timestamp when the API was created
        Description:
          type: string
          description: The description of the API
        DisableExecuteApiEndpoint:
          type: boolean
          description: Specifies whether clients can invoke your API by using the default execute-api endpoint
        DisableSchemaValidation:
          type: boolean
          description: Avoid validating models when creating the APIs
        Name:
          type: string
          description: The name of the API
        ProtocolType:
          type: string
          enum: [HTTP, WEBSOCKET]
          description: The API protocol
        RouteSelectionExpression:
          type: string
          description: The route selection expression for the API
        Tags:
          type: object
          additionalProperties:
            type: string
          description: The collection of tags
        Version:
          type: string
          description: A version identifier for the API
        Warnings:
          type: array
          items:
            type: string
          description: The warning messages reported when failonwarnings is turned on during API import

    CorsConfiguration:
      type: object
      description: Represents a CORS configuration
      properties:
        AllowCredentials:
          type: boolean
          description: Specifies whether credentials are included in the CORS request
        AllowHeaders:
          type: array
          items:
            type: string
          description: Represents the allowed HTTP headers
        AllowMethods:
          type: array
          items:
            type: string
          description: Represents the allowed HTTP methods
        AllowOrigins:
          type: array
          items:
            type: string
          description: Represents the allowed origins
        ExposeHeaders:
          type: array
          items:
            type: string
          description: Represents the exposed HTTP headers
        MaxAge:
          type: integer
          format: int32
          description: The number of seconds that the browser should cache a preflight request result

    Route:
      type: object
      description: Represents a route for an HTTP API (V2)
      properties:
        ApiGatewayManaged:
          type: boolean
          description: Specifies whether the route was created by API Gateway
        ApiKeyRequired:
          type: boolean
          description: Specifies whether an API key is required for this route
        AuthorizationScopes:
          type: array
          items:
            type: string
          description: A list of authorization scopes configured on this route
        AuthorizationType:
          type: string
          enum: [NONE, AWS_IAM, CUSTOM, JWT, COGNITO_USER_POOLS, MUTUAL_TLS]
          description: The authorization type for the route
        AuthorizerId:
          type: string
          description: The identifier of the Authorizer resource to be associated with this route
        ModelSelectionExpression:
          type: string
          description: The model selection expression for the route
        OperationName:
          type: string
          description: The operation name for the route
        RequestModels:
          type: object
          additionalProperties:
            type: string
          description: The request models for the route
        RequestParameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ParameterConstraints'
          description: The request parameters for the route
        RouteId:
          type: string
          description: The route ID
        RouteKey:
          type: string
          description: The route key for the route
        RouteResponseSelectionExpression:
          type: string
          description: The route response selection expression for the route
        Target:
          type: string
          description: The target for the route

    ParameterConstraints:
      type: object
      description: Validation constraints for route parameters
      properties:
        Required:
          type: boolean
          description: Whether the parameter is required

    Integration:
      type: object
      description: Represents an integration for an HTTP API (V2)
      properties:
        ApiGatewayManaged:
          type: boolean
          description: Specifies whether the integration was created by API Gateway
        ConnectionId:
          type: string
          description: The ID of the VPC link for a private integration
        ConnectionType:
          type: string
          enum: [INTERNET, VPC_LINK]
          description: The type of the network connection to the integration endpoint
        ContentHandlingStrategy:
          type: string
          enum: [CONVERT_TO_BINARY, CONVERT_TO_TEXT]
          description: Specifies how to handle response payload content type conversions
        CredentialsArn:
          type: string
          description: Specifies the credentials required for the integration, if any
        Description:
          type: string
          description: The description of the integration
        IntegrationId:
          type: string
          description: The integration ID
        IntegrationMethod:
          type: string
          description: The integration HTTP method (e.g., GET, POST)
        IntegrationResponseSelectionExpression:
          type: string
          description: The integration response selection expression
        IntegrationSubtype:
          type: string
          description: The AWS service action to invoke
        IntegrationUri:
          type: string
          description: The integration URI
        IntegrationType:
          type: string
          enum: [AWS, AWS_PROXY, HTTP, HTTP_PROXY, MOCK]
          description: The integration type
        PayloadFormatVersion:
          type: string
          description: Specifies the format of the payload sent to an integration
        RequestParameters:
          type: object
          additionalProperties:
            type: string
          description: The request parameters for the integration
        RequestTemplates:
          type: object
          additionalProperties:
            type: string
          description: The request templates for the integration
        ResponseParameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResponseParameterList'
          description: The response parameters for the integration
        TemplateSelectionExpression:
          type: string
          description: The template selection expression for the integration
        TimeoutInMillis:
          type: integer
          format: int32
          description: Custom timeout between 50 and 30000 milliseconds
        TlsConfig:
          $ref: '#/components/schemas/TlsConfig'

    ResponseParameterList:
      type: object
      properties:
        ResponseParameters:
          type: object
          additionalProperties:
            type: string
          description: Mapping of response parameters

    TlsConfig:
      type: object
      description: The TLS configuration for a private integration
      properties:
        ServerNameToVerify:
          type: string
          description: The name of the server to verify

    Stage:
      type: object
      description: Represents a stage for an HTTP API (V2)
      properties:
        AccessLogSettings:
          $ref: '#/components/schemas/AccessLogSettings'
        ApiGatewayManaged:
          type: boolean
          description: Specifies whether the stage was created by API Gateway
        AutoDeploy:
          type: boolean
          description: Specifies whether updates to an API automatically trigger a new deployment
        ClientCertificateId:
          type: string
          description: The identifier of a client certificate for a Stage
        CreatedDate:
          type: string
          format: date-time
          description: The timestamp when the stage was created
        DefaultRouteSettings:
          $ref: '#/components/schemas/RouteSettings'
        DeploymentId:
          type: string
          description: The identifier of the Deployment that the Stage is associated with
        Description:
          type: string
          description: The description of the stage
        LastDeploymentStatusMessage:
          type: string
          description: Description of the last deployment status message
        LastUpdatedDate:
          type: string
          format: date-time
          description: The timestamp when the stage was last updated
        RouteSettings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RouteSettings'
          description: The route settings for the stage
        StageName:
          type: string
          description: The name of the stage
        StageVariables:
          type: object
          additionalProperties:
            type: string
          description: A map that defines the stage variables
        Tags:
          type: object
          additionalProperties:
            type: string
          description: The collection of tags

    AccessLogSettings:
      type: object
      description: Settings for logging access in a stage
      properties:
        DestinationArn:
          type: string
          description: The ARN of the CloudWatch Logs log group to receive access logs
        Format:
          type: string
          description: A single line format of the access logs of data, as specified by selected $context variables

    RouteSettings:
      type: object
      description: Represents a collection of route settings
      properties:
        DataTraceEnabled:
          type: boolean
          description: Specifies whether data trace logging is enabled for this route
        DetailedMetricsEnabled:
          type: boolean
          description: Specifies whether detailed metrics are enabled
        LoggingLevel:
          type: string
          enum: [ERROR, INFO, OFF]
          description: The logging level
        ThrottlingBurstLimit:
          type: integer
          format: int32
          description: The throttling burst limit
        ThrottlingRateLimit:
          type: number
          format: double
          description: The throttling rate limit

    # ============================================================
    # V2 Input/Output Schemas
    # ============================================================

    GetApisInput:
      type: object
      description: Input for listing HTTP APIs (V2)
      properties:
        MaxResults:
          type: string
          description: The maximum number of results to return
        NextToken:
          type: string
          description: The next token for paginated results

    GetApisOutput:
      type: object
      properties:
        Items:
          type: array
          items:
            $ref: '#/components/schemas/Api'
          description: The HTTP API objects
        NextToken:
          type: string
          description: The next token for paginated results

    CreateApiInput:
      type: object
      description: Input for creating an HTTP API (V2)
      properties:
        ApiKeySelectionExpression:
          type: string
          description: An API key selection expression
        CorsConfiguration:
          $ref: '#/components/schemas/CorsConfiguration'
        CredentialsArn:
          type: string
          description: This property is part of the import API, not used for creation
        Description:
          type: string
          description: The description of the API
        DisableExecuteApiEndpoint:
          type: boolean
          description: Specifies whether clients can invoke your API by using the default execute-api endpoint
        DisableSchemaValidation:
          type: boolean
          description: Avoid validating models when creating the APIs
        Name:
          type: string
          description: The name of the API
        ProtocolType:
          type: string
          enum: [HTTP, WEBSOCKET]
          description: The API protocol (defaults to HTTP)
        RouteKey:
          type: string
          description: The route key for the first route
        RouteSelectionExpression:
          type: string
          description: The route selection expression for the API
        Tags:
          type: object
          additionalProperties:
            type: string
          description: The collection of tags
        Target:
          type: string
          description: The target for the first route
        Version:
          type: string
          description: A version identifier for the API

    CreateApiOutput:
      type: object
      properties:
        ApiEndpoint:
          type: string
        ApiId:
          type: string
        ApiKeySelectionExpression:
          type: string
        CorsConfiguration:
          $ref: '#/components/schemas/CorsConfiguration'
        CreatedDate:
          type: string
          format: date-time
        Description:
          type: string
        DisableExecuteApiEndpoint:
          type: boolean
        DisableSchemaValidation:
          type: boolean
        Name:
          type: string
        ProtocolType:
          type: string
        RouteSelectionExpression:
          type: string
        Tags:
          type: object
          additionalProperties:
            type: string
        Version:
          type: string
        Warnings:
          type: array
          items:
            type: string

    GetApiOutput:
      $ref: '#/components/schemas/Api'

    DeleteApiOutput:
      type: object
      properties: {}

    GetRoutesOutput:
      type: object
      properties:
        Items:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          description: The route elements
        NextToken:
          type: string
          description: The next token for paginated results

    CreateRouteInput:
      type: object
      required: [RouteKey]
      description: Input for creating a route (V2)
      properties:
        ApiKeyRequired:
          type: boolean
          description: Specifies whether an API key is required for this route
        AuthorizationScopes:
          type: array
          items:
            type: string
          description: A list of authorization scopes configured on this route
        AuthorizationType:
          type: string
          enum: [NONE, AWS_IAM, CUSTOM, JWT, COGNITO_USER_POOLS, MUTUAL_TLS]
          description: The authorization type for the route
        AuthorizerId:
          type: string
          description: The identifier of the Authorizer resource to be associated with this route
        ModelSelectionExpression:
          type: string
          description: The model selection expression for the route
        OperationName:
          type: string
          description: The operation name for the route
        RequestModels:
          type: object
          additionalProperties:
            type: string
          description: The request models for the route
        RequestParameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ParameterConstraints'
          description: The request parameters for the route
        RouteKey:
          type: string
          description: The route key for the route
        RouteResponseSelectionExpression:
          type: string
          description: The route response selection expression for the route
        Target:
          type: string
          description: The target for the route

    CreateRouteOutput:
      $ref: '#/components/schemas/Route'

    UpdateRouteInput:
      type: object
      description: Input for updating a route (V2)
      properties:
        ApiKeyRequired:
          type: boolean
        AuthorizationScopes:
          type: array
          items:
            type: string
        AuthorizationType:
          type: string
