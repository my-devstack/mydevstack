openapi: 3.0.0
info:
  title: MyDevStack AWS Proxy API
  description: |
    Proxy API that exposes AWS service operations via HTTP REST endpoints.
    All POST/PUT endpoints accept lowercase JSON keys which are TitleCased
    for AWS SDK compatibility.
  version: "1.0.0"
  contact:
    name: MyDevStack
    url: https://my-devstack.github.io/

servers:
  - url: http://localhost:8081
    description: Local development (Floci/LocalStack on :4566)
  - url: http://<proxy-host>:<port>
    description: Production

tags:
  - name: Management
    description: Proxy management endpoints (health, region)
  - name: S3
    description: Simple Storage Service
  - name: Lambda
    description: AWS Lambda
  - name: DynamoDB
    description: Amazon DynamoDB
  - name: IAM
    description: Identity and Access Management
  - name: SQS
    description: Simple Queue Service
  - name: SNS
    description: Simple Notification Service
  - name: CloudFormation
    description: AWS CloudFormation
  - name: CloudWatch
    description: Amazon CloudWatch
  - name: CloudWatch Logs
    description: Amazon CloudWatch Logs
  - name: KMS
    description: AWS Key Management Service
  - name: Secrets Manager
    description: AWS Secrets Manager
  - name: Kinesis
    description: Amazon Kinesis
  - name: SSM
    description: AWS Systems Manager Parameter Store
  - name: Step Functions
    description: AWS Step Functions
  - name: API Gateway
    description: API Gateway (V1 REST + V2 HTTP APIs)
  - name: DynamoDB Streams
    description: Amazon DynamoDB Streams
  - name: SES
    description: Amazon Simple Email Service v2
  - name: MSK
    description: Managed Streaming for Apache Kafka
  - name: OpenSearch
    description: Amazon OpenSearch Service
  - name: ElastiCache
    description: Amazon ElastiCache
  - name: RDS
    description: Amazon Relational Database Service

