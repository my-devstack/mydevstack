name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  lint-proxy:
    name: Lint Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0

      - name: Run golangci-lint
        run: make lint-proxy

  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Install dependencies
        run: cd pkg/ui && npm ci --legacy-peer-deps

      - name: Run ESLint
        run: cd pkg/ui && npm run lint

  test-ui:
    name: Test UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Install dependencies
        run: cd pkg/ui && npm ci --legacy-peer-deps

      - name: Run Vitest
        run: cd pkg/ui && npm run test:run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-report
          path: pkg/ui/coverage
          retention-days: 7

  test-proxy:
    name: Test Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: cd pkg/proxy && go mod download

      - name: Run unit tests
        run: make unit-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: unit.html
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - lint-proxy
      - lint-ui
      - test-proxy
      - test-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Start Floci
        run: |
          docker run -d --name floci -p 4566:4566 floci/floci:latest
          sleep 5
          for i in {1..30}; do
            curl -s http://localhost:4566/_localstack/health | grep -q '"available"' && break
            sleep 2
          done

      - name: Install Go dependencies
        run: go mod download
        working-directory: pkg/proxy

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps
        working-directory: .

      - name: Install UI dependencies
        run: npm ci --legacy-peer-deps
        working-directory: pkg/ui

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build and start servers
        run: |
          pkill -f "go run" 2>/dev/null || true
          pkill -f vite 2>/dev/null || true
          sleep 2
          cd pkg/proxy && go run ./cmd/server &
          sleep 10
          cd pkg/ui && npm run build
          pkill -f vite 2>/dev/null || true
          npx vite preview --port 3000 &
          sleep 10

      - name: Run E2E tests
        run: npm run test:e2e
        # env:
        #   BASE_URL: http://localhost:3000
        #   PROXY_URL: http://localhost:8081

      - name: Cleanup
        if: always()
        run: |
          docker stop floci 2>/dev/null || true
          docker rm floci 2>/dev/null || true
          pkill -f "go run" 2>/dev/null || true
          pkill -f vite 2>/dev/null || true
  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: e2e

    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
            ARTIFACT_NAME: mydevstack-proxy-linux-amd64
          - GOOS: linux
            GOARCH: arm64
            ARTIFACT_NAME: mydevstack-proxy-linux-arm64
          - GOOS: darwin
            GOARCH: amd64
            ARTIFACT_NAME: mydevstack-proxy-darwin-amd64
          - GOOS: darwin
            GOARCH: arm64
            ARTIFACT_NAME: mydevstack-proxy-darwin-arm64
          - GOOS: windows
            GOARCH: amd64
            ARTIFACT_NAME: mydevstack-proxy-windows-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get tag info
        id: tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Go Binary
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="mydevstack-proxy"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          mkdir -p "dist/${GOOS}/${GOARCH}"
          go build -ldflags="-s -w -X main.Version=${{ steps.tag.outputs.VERSION }} -X main.BuildDate=${{ steps.tag.outputs.DATE }}" -o "dist/${GOOS}/${GOARCH}/${BINARY_NAME}" ./pkg/proxy/cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT_NAME }}
          path: dist/${{ matrix.GOOS }}/${{ matrix.GOARCH }}/*
          retention-days: 5

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "$VERSION" > pkg/ui/public/VERSION

      - name: Build Vue UI
        run: |
          cd pkg/ui
          npm ci --legacy-peer-deps
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydevstack-ui
          path: pkg/ui/dist
          retention-days: 5

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-release
      - build-ui

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create zipped release assets
        run: |
          cd artifacts
          rm -f *.zip checksums.txt
          shopt -s nullglob
          for d in */; do
            [ -d "$d" ] || continue
            artifact_name="${d%/}"
            zip -r "${artifact_name}.zip" "$d"
          done
          ls -la *.zip

      - name: Create checksum file
        run: |
          cd artifacts
          find . -maxdepth 1 -name '*.zip' | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Get previous tag
        id: prev-tag
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-creatordate --format='%(refname:lstrip=2)' | grep -v -- "$CURRENT" | head -1 || true)
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate release notes
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const previousTag = '${{ steps.prev-tag.outputs.previous_tag }}';
            const currentTag = '${{ github.ref_name }}';
            console.log('Current tag:', currentTag);
            console.log('Previous tag:', JSON.stringify(previousTag));
            
            let releaseNotes = '';
            if (!previousTag || previousTag.trim() === '') {
              console.log('No previous tag found, generating empty notes');
            } else {
              try {
                // Use GitHub's compare API to get commits between tags
                console.log('Fetching commits between', previousTag.trim(), 'and', currentTag);
                
                const response = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: previousTag.trim(),
                  head: currentTag
                });
                
                console.log('Compare response status:', response.status);
                console.log('Total commits:', response.data.total_commits);
                console.log('Commits array:', response.data.commits?.length);
                
                // Generate release notes from commits
                const commits = response.data.commits || [];
                const authors = [...new Set(commits.map(c => c.commit.author.name))];
                
                releaseNotes = '## Changes\n\nTotal commits: ' + commits.length + '\n\n';
                
                if (commits.length > 0) {
                  releaseNotes += '### Commits\n\n';
                  commits.slice(0, 50).forEach(commit => {
                    const msg = commit.commit.message.split('\n')[0];
                    releaseNotes += '- ' + msg + ' (' + commit.sha.substring(0, 7) + ')\n';
                  });
                }
                
                releaseNotes += '\n### Authors\n' + authors.map(a => '- ' + a).join('\n');
                
              } catch (err) {
                console.error('Failed to generate release notes:', err.message);
                console.error('Error status:', err.status);
                console.error('Error details:', JSON.stringify(err));
                releaseNotes = '';
              }
            }
            console.log('Release notes generated, length:', (releaseNotes || '').length);
            // Write to GITHUB_OUTPUT for env var usage
            const fs = require('fs');
            const outputPath = process.env.GITHUB_OUTPUT;
            fs.writeFileSync(outputPath, 'release_notes=' + releaseNotes + '\n');
            return releaseNotes;

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## Docker Image

            ```bash
            docker pull beabys/mydevstack:${{ github.ref_name }}
            ```

            ---

            ${{ env.release_notes }}
          draft: false
        env:
          release_notes: ${{ steps.release-notes.outputs.release_notes }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docker:
    name: Release Docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_REGISTRY: docker.io
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mydevstack