name: CI

on:
  pull_request:
  push:
    branches:
      - main
  push:
    tags:
      - 'v*'

jobs:
  lint-proxy:
    name: Lint Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0

      - name: Run golangci-lint
        run: cd pkg/proxy && golangci-lint run

  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Run ESLint
        run: |
          cd pkg/ui
          npm run lint

  test-proxy:
    name: Test Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: cd pkg/proxy && go mod download

      - name: Run unit tests
        run: cd pkg/proxy && go test ./...

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: 
      - lint-proxy
      - lint-ui
      - test-proxy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Go Binary
        run: |
          cd pkg/proxy
          GOOS=linux GOARCH=amd64 go build -o mydevstack-proxy-linux-amd64 ./cmd/server/
          GOOS=darwin GOARCH=amd64 go build -o mydevstack-proxy-darwin-amd64 ./cmd/server/
          GOOS=windows GOARCH=amd64 go build -o mydevstack-proxy-windows-amd64.exe ./cmd/server/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Build Vue UI
        run: |
          cd pkg/ui
          npm ci
          npm run build
          zip -r dist.zip dist/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: MyDevStack ${{ env.VERSION }}
          files: |
            pkg/proxy/mydevstack-proxy-linux-amd64
            pkg/proxy/mydevstack-proxy-darwin-amd64
            pkg/proxy/mydevstack-proxy-windows-amd64.exe
            pkg/ui/dist.zip
          draft: false
          prerelease: false

  release-docker:
    name: Release Docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_REGISTRY: docker.io
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mydevstack