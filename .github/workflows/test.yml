name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-proxy:
    name: Lint Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0

      - name: Run golangci-lint
        run: make lint-proxy

  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Install dependencies
        run: cd pkg/ui && npm ci --legacy-peer-deps

      - name: Run ESLint
        run: cd pkg/ui && npm run lint

  test-ui:
    name: Test UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Install dependencies
        run: cd pkg/ui && npm ci --legacy-peer-deps

      - name: Run Vitest
        run: cd pkg/ui && npm run test:run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-report
          path: pkg/ui/coverage
          retention-days: 7

  test-proxy:
    name: Test Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: cd pkg/proxy && go mod download

      - name: Run unit tests
        run: make unit-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: unit.html
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs:
      - lint-proxy
      - lint-ui
      - test-proxy
      - test-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Start Floci
        run: |
          docker run -d --name floci -p 4566:4566 floci/floci:latest
          sleep 5
          for i in {1..30}; do
            curl -s http://localhost:4566/_localstack/health | grep -q '"available"' && break
            sleep 2
          done

      - name: Install Go dependencies
        run: go mod download
        working-directory: pkg/proxy

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps
        working-directory: .

      - name: Install UI dependencies
        run: npm ci --legacy-peer-deps
        working-directory: pkg/ui

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build and start servers
        run: |
          pkill -f "go run" 2>/dev/null || true
          pkill -f vite 2>/dev/null || true
          sleep 2
          cd pkg/proxy && go run ./cmd/server &
          sleep 10
          cd pkg/ui && npm run build
          pkill -f vite 2>/dev/null || true
          npx vite preview --port 3000 &
          sleep 10
          for i in {1..5}; do
            if curl -sf http://localhost:8081/health > /dev/null; then
              echo "Server healthy"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "Server not healthy after 5 attempts"
              exit 1
            fi
            echo "Waiting for server... ($i/5)"
            sleep 15
          done

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Cleanup
        if: always()
        run: |
          docker stop floci 2>/dev/null || true
          docker rm floci 2>/dev/null || true
          pkill -f "go run" 2>/dev/null || true
          pkill -f vite 2>/dev/null || true
