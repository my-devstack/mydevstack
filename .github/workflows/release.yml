name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mydevstack

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      frontend_version: ${{ steps.versions.outputs.frontend_version }}
      backend_version: ${{ steps.versions.outputs.backend_version }}
      tag: ${{ steps.versions.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read release.json
        id: versions
        run: |
          FRONTEND_VERSION=$(jq -r '.frontend' release.json)
          BACKEND_VERSION=$(jq -r '.backend' release.json)
          TAG=${GITHUB_TAG#v}
          
          echo "frontend_version=$FRONTEND_VERSION" >> $GITHUB_OUTPUT
          echo "backend_version=$BACKEND_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_TAG: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.tag }}
          build-args: |
            FRONTEND_VERSION=${{ steps.versions.outputs.frontend_version }}
            BACKEND_VERSION=${{ steps.versions.outputs.backend_version }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get frontend release notes
        id: frontend_release
        run: |
          # Fetch release notes from mydevstack-ui
          RELEASE_DATA=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/my-devstack/mydevstack-ui/releases/tags/${{ needs.release.outputs.frontend_version }}")
          
          FRONTEND_BODY=$(echo "$RELEASE_DATA" | jq -r '.body // "No release notes"')
          FRONTEND_URL=$(echo "$RELEASE_DATA" | jq -r '.html_url // ""')
          
          # Save to file to handle special characters
          echo "$FRONTEND_BODY" > frontend_body.txt
          echo "$FRONTEND_URL" > frontend_url.txt
          
          echo "body=$(cat frontend_body.txt | jq -Rs .)" >> $GITHUB_OUTPUT
          echo "url=$(cat frontend_url.txt)" >> $GITHUB_OUTPUT

      - name: Get backend release notes
        id: backend_release
        run: |
          # Fetch release notes from mydevstack-proxy
          RELEASE_DATA=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/my-devstack/mydevstack-proxy/releases/tags/${{ needs.release.outputs.backend_version }}")
          
          BACKEND_BODY=$(echo "$RELEASE_DATA" | jq -r '.body // "No release notes"')
          BACKEND_URL=$(echo "$RELEASE_DATA" | jq -r '.html_url // ""')
          
          # Save to file to handle special characters
          echo "$BACKEND_BODY" > backend_body.txt
          echo "$BACKEND_URL" > backend_url.txt
          
          echo "body=$(cat backend_body.txt | jq -Rs .)" >> $GITHUB_OUTPUT
          echo "url=$(cat backend_url.txt)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: MyDevStack ${{ needs.release.outputs.tag }}
          body: |
            ## Components

            ### Frontend (${{ needs.release.outputs.frontend_version }})
            [${{ steps.frontend_release.outputs.url }}](${{ steps.frontend_release.outputs.url }})

            ${{ steps.frontend_release.outputs.body }}

            ### Backend (${{ needs.release.outputs.backend_version }})
            [${{ steps.backend_release.outputs.url }}](${{ steps.backend_release.outputs.url }})

            ${{ steps.backend_release.outputs.body }}

            ## Docker Image

            ```
            docker pull beabys/mydevstack:${{ needs.release.outputs.tag }}
            ```

            ## Notes

            - Frontend: ${{ needs.release.outputs.frontend_version }}
            - Backend: ${{ needs.release.outputs.backend_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}