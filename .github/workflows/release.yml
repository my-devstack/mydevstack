name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-tag:
    name: Verify Tag Branch
    runs-on: ubuntu-latest
    outputs:
      is-main: ${{ steps.check.outputs.is-main }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag is from main
        id: check
        run: |
          TAG="${{ github.ref_name }}"
          MAIN_COMMIT=$(git rev-parse origin/main)
          TAG_COMMIT=$(git rev-parse "$TAG")
          if git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT"; then
            echo "is-main=true" >> $GITHUB_OUTPUT
          else
            echo "is-main=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG is not from main branch"
          fi

  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: verify-tag
    if: needs.verify-tag.outputs.is-main == 'true'
    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
            ARTIFACT_NAME: mydevstack-proxy-linux-amd64
          - GOOS: linux
            GOARCH: arm64
            ARTIFACT_NAME: mydevstack-proxy-linux-arm64
          - GOOS: darwin
            GOARCH: amd64
            ARTIFACT_NAME: mydevstack-proxy-darwin-amd64
          - GOOS: darwin
            GOARCH: arm64
            ARTIFACT_NAME: mydevstack-proxy-darwin-arm64
          - GOOS: windows
            GOARCH: amd64
            ARTIFACT_NAME: mydevstack-proxy-windows-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get tag info
        id: tag
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Go Binary
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="mydevstack-proxy"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          mkdir -p "dist/${GOOS}/${GOARCH}"
          go build -ldflags="-s -w -X main.Version=${{ steps.tag.outputs.VERSION }} -X main.BuildDate=${{ steps.tag.outputs.DATE }}" -o "dist/${GOOS}/${GOARCH}/${BINARY_NAME}" ./pkg/proxy/cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT_NAME }}
          path: dist/${{ matrix.GOOS }}/${{ matrix.GOARCH }}/*
          retention-days: 5

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs: verify-tag
    if: needs.verify-tag.outputs.is-main == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pkg/ui/package-lock.json

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "$VERSION" > pkg/ui/public/VERSION

      - name: Build Vue UI
        run: |
          cd pkg/ui
          npm ci --legacy-peer-deps
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydevstack-ui
          path: pkg/ui/dist
          retention-days: 5

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-release
      - build-ui

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create zipped release assets
        run: |
          cd artifacts
          rm -f *.zip checksums.txt
          shopt -s nullglob
          for d in */; do
            [ -d "$d" ] || continue
            artifact_name="${d%/}"
            zip -r "${artifact_name}.zip" "$d"
          done
          ls -la *.zip

      - name: Create checksum file
        run: |
          cd artifacts
          find . -maxdepth 1 -name '*.zip' | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Get previous tag
        id: prev-tag
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-creatordate --format='%(refname:lstrip=2)' | grep -v -- "$CURRENT" | head -1 || true)
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate release notes
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const previousTag = '${{ steps.prev-tag.outputs.previous_tag }}';
            const currentTag = '${{ github.ref_name }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            console.log('Current tag:', currentTag);
            console.log('Previous tag:', JSON.stringify(previousTag));
            
            let releaseNotes = '';
            if (!previousTag || previousTag.trim() === '') {
              console.log('No previous tag found, generating empty notes');
            } else {
              try {
                const response = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: previousTag.trim(),
                  head: currentTag
                });
                
                const commits = response.data.commits || [];
                const commitShas = commits.map(c => c.sha);
                console.log('Total commits:', commitShas.length);
                
                const prs = [];
                const seenPrs = new Set();
                
                for (const commit of commits) {
                  const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    commit_sha: commit.sha
                  });
                  
                  for (const pr of pullRequests) {
                    if (!seenPrs.has(pr.number)) {
                      seenPrs.add(pr.number);
                      prs.push({
                        number: pr.number,
                        title: pr.title,
                        author: pr.user.login,
                        url: pr.html_url
                      });
                    }
                  }
                }
                
                releaseNotes = '## Changes\n\nTotal PRs: ' + prs.length + '\n\n';
                
                if (prs.length > 0) {
                  releaseNotes += '### Pull Requests\n\n';
                  prs.forEach(pr => {
                    releaseNotes += '* [' + pr.title + '](<' + pr.url + '>) by @' + pr.author + '\n';
                  });
                }
                
              } catch (err) {
                console.error('Failed to generate release notes:', err.message);
                releaseNotes = '';
              }
            }
            
            if (previousTag && previousTag.trim() !== '') {
              releaseNotes += '\n\n**Full Changelog**: [' + previousTag + '...' + currentTag + '](' + repoUrl + '/compare/' + previousTag + '...' + currentTag + ')';
            }
            
            console.log('Release notes generated, length:', (releaseNotes || '').length);
            
            const fs = require('fs');
            const outputPath = process.env.GITHUB_OUTPUT;
            fs.writeFileSync(outputPath, 'release_notes<<EOF\n' + releaseNotes + '\nEOF\n');
            return releaseNotes;

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## Docker Image

            ```bash
            docker pull beabys/mydevstack:${{ github.ref_name }}
            ```

            ---

            ${{ env.release_notes }}
          draft: false
        env:
          release_notes: ${{ steps.release-notes.outputs.release_notes }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-docker:
    name: Release Docker
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_REGISTRY: docker.io
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mydevstack
